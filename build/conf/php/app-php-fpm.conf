[global]
pid = run/php/php-fpm.pid
error_log = PHP_FPM_ERROR_LOG

[app]
user = NGINX_RUN_USER
group = NGINX_RUN_GROUP

listen = PHP_FPM_SOCK_PATH
listen.owner = NGINX_RUN_USER
listen.group = NGINX_RUN_GROUP
listen.mode = 0660

pm = dynamic
pm.max_children = 25
pm.start_servers = 3
pm.min_spare_servers = 3
pm.max_spare_servers = 6
pm.max_requests = 500

; Route worker stdout/stderr (PHP warnings/notices, var_dump, fatals) to the
; pool error_log (/proc/self/fd/2) so it reaches the container log stream.
catch_workers_output = yes
decorate_workers_output = no
